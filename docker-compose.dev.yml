services:
    db:
        image: postgres:17
        container_name: postgres_db_dev
        restart: always
        env_file:
            - ./config/.env.development
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    
    backend:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: nest_backend_dev
        restart: always
        ports:
            - "3000:3000"
        volumes:
            - .:/app
            - /app/node_modules
        env_file:
            - ./config/.env.development
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npm run start:dev"

volumes:
    pgdata: