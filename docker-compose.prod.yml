services:
    db:
        image: postgres:17
        container_name: postgres_db_prod
        restart: unless-stopped
        env_file:
            - ./config/.env.production
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - backend_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    
    backend:
        build:
            context: .
            dockerfile: Dockerfile.prod
        container_name: nest_backend_prod
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: production
        env_file:
            - ./config/.env.production
        networks:
            - backend_network
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "npx prisma db push && npx prisma db seed && npm run start:prod"

volumes:
    pgdata:

networks:
  backend_network:
    driver: bridge